<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tima Zadachka · математика 3 класс</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', 'Cambria Math', sans-serif; color: #12314e;
    background: radial-gradient(circle at 10% 10%, rgba(127, 182, 224, 0.4), transparent 40%),
                radial-gradient(circle at 90% 20%, rgba(255, 217, 112, 0.4), transparent 40%),
                linear-gradient(160deg, #eaf3fb 0%, #f6f9fd 50%, #fff8ec 100%);
    display: flex; justify-content: center; align-items: flex-start;
    padding: 30px 16px; min-height: 100vh;
  }
  .bg-symbols { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .bg-symbols span { position: absolute; font-family: 'Cambria Math', serif; font-weight: 600; color: rgba(47, 127, 184, 0.1); animation: float 14s ease-in-out infinite; }
  .bg-symbols span:nth-child(1) { top: 8%; left: 5%; font-size: 6rem; }
  .bg-symbols span:nth-child(2) { top: 70%; left: 88%; font-size: 7rem; color: rgba(232, 178, 58, 0.14); animation-delay: 2s; }
  .bg-symbols span:nth-child(3) { top: 82%; left: 8%; font-size: 5rem; animation-delay: 4s; }
  .bg-symbols span:nth-child(4) { top: 15%; left: 82%; font-size: 5.5rem; color: rgba(47, 168, 106, 0.12); animation-delay: 1.5s; }
  @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-22px) rotate(6deg); } }

  .notebook { position: relative; z-index: 1; width: 100%; max-width: 860px; background: #ffffff; border-radius: 28px; padding: 40px 36px 36px; box-shadow: 0 20px 45px -18px rgba(15, 43, 70, 0.28); border: 1px solid rgba(127, 182, 224, 0.4); }
  
  header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 22px; border-bottom: 2px dashed rgba(47, 127, 184, 0.25); margin-bottom: 24px; }
  .header-left { display: flex; align-items: center; gap: 18px; }
  .logo-badge { display: grid; place-items: center; width: 74px; height: 74px; border-radius: 22px; background: linear-gradient(145deg, #2f7fb8, #1c4f7c); color: #fff; font-size: 2.2rem; box-shadow: 0 10px 20px -8px rgba(28, 79, 124, 0.65); transform: rotate(-3deg); transition: transform 0.3s; }
  .logo-badge:hover { transform: rotate(4deg) scale(1.04); }
  .header-text h1 { font-size: 2.15rem; color: #0f2b46; letter-spacing: -0.6px; }
  .header-text p { margin-top: 6px; font-size: 1rem; color: #2f7fb8; font-style: italic; }
  .header-text p b { font-style: normal; color: #1c4f7c; }
  
  .sound-toggle { background: #f0f7fd; border: 2px solid #d8e9f8; border-radius: 50%; width: 48px; height: 48px; display: grid; place-items: center; cursor: pointer; font-size: 1.4rem; transition: 0.2s; box-shadow: 0 4px 0 #d8e9f8; }
  .sound-toggle:hover { background: #e6f1fb; transform: translateY(-2px); box-shadow: 0 6px 0 #d8e9f8; }
  .sound-toggle:active { transform: translateY(2px); box-shadow: 0 2px 0 #d8e9f8; }

  .score-panel { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 20px; background: linear-gradient(135deg, #fffaf0, #ffeec2 60%, #ffe3a3); border: 1px solid rgba(232, 178, 58, 0.55); border-radius: 18px; padding: 16px 22px; margin-bottom: 24px; }
  .score-total { display: flex; align-items: center; gap: 10px; font-weight: 600; color: #8a6200; }
  .score-total .star { font-size: 1.8rem; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15) rotate(8deg); } }
  .score-total .points { font-family: 'Cambria Math', serif; font-size: 2rem; font-weight: 700; color: #b8860b; min-width: 32px; }
  .progress-info { display: flex; flex-direction: column; gap: 6px; font-size: 0.92rem; color: #8a6200; }
  .progress-bar-wrap { height: 12px; background: #fff8e6; border-radius: 20px; border: 1px solid rgba(232, 178, 58, 0.5); overflow: hidden; }
  .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #f5c542, #e8a800); transition: width 0.45s; }
  .rules-hint { font-size: 0.82rem; color: #9a7b2e; font-style: italic; text-align: right; }

  .task-card { background: #f8fbfe; border: 1px solid rgba(127, 182, 224, 0.5); border-radius: 28px; padding: 26px 30px 30px; }
  .task-label { display: flex; justify-content: space-between; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2.5px; color: #2f7fb8; font-weight: 600; margin-bottom: 16px; }
  .task-number { font-family: monospace; background: #d8e9f8; color: #1c4f7c; padding: 5px 14px; border-radius: 30px; }
  .formula-display { font-size: 2.9rem; text-align: center; color: #0f2b46; font-weight: 600; background: #ffffff; padding: 30px 16px; border-radius: 18px; border: 1px solid rgba(127, 182, 224, 0.45); margin-bottom: 24px; min-height: 120px; display: flex; align-items: center; justify-content: center; }

  .input-area { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: center; }
  .answer-box { flex: 0 1 260px; display: flex; align-items: center; background: #ffffff; border: 2px solid #7fb6e0; border-radius: 60px; padding: 4px 8px 4px 20px; }
  .answer-box:focus-within { border-color: #2f7fb8; box-shadow: 0 0 0 5px rgba(47, 127, 184, 0.15); }
  .answer-box .prefix { font-family: 'Cambria Math', serif; font-size: 1.4rem; color: #2f7fb8; margin-right: 10px; font-weight: 600; }
  .answer-box input { flex: 1; width: 100%; border: none; outline: none; font-size: 1.4rem; font-weight: 600; color: #0f2b46; padding: 12px 6px; background: transparent; }
  .answer-box input::placeholder { color: #a9c3dc; font-weight: 400; font-style: italic; font-size: 1rem; }

  .button-group { display: flex; flex-wrap: wrap; gap: 10px; }
  .btn { border: none; cursor: pointer; font-size: 1rem; font-weight: 600; padding: 14px 24px; border-radius: 60px; display: inline-flex; justify-content: center; align-items: center; transition: 0.15s; }
  .btn-primary { background: linear-gradient(180deg, #3a8ecb, #1c5f93); color: #fff; box-shadow: 0 6px 0 #123f61; }
  .btn-primary:hover { background: linear-gradient(180deg, #4a9ddb, #2470a8); transform: translateY(-2px); box-shadow: 0 8px 0 #123f61; }
  .btn-primary:active { transform: translateY(4px); box-shadow: 0 2px 0 #123f61; }
  .btn-secondary { background: #e8f2fb; color: #1c4f7c; box-shadow: 0 5px 0 #c9def0; }
  .btn-secondary:hover { background: #d9eaf8; transform: translateY(-2px); box-shadow: 0 7px 0 #c9def0; }
  .btn-secondary:active { transform: translateY(4px); box-shadow: 0 1px 0 #c9def0; }
  
  .btn-next { margin-top: 22px; width: 100%; background: linear-gradient(135deg, #f7d97a, #e8b23a); color: #5a3d00; box-shadow: 0 6px 0 #b8860b; font-size: 1.1rem; }
  .btn-next:hover { background: linear-gradient(135deg, #ffe38a, #f0bd48); transform: translateY(-2px); box-shadow: 0 8px 0 #b8860b; }
  .btn-next:active { transform: translateY(4px); box-shadow: 0 2px 0 #b8860b; }

  .feedback { margin-top: 20px; padding: 16px 22px; border-radius: 18px; font-size: 1.05rem; display: flex; align-items: center; gap: 12px; min-height: 62px; border: 1px solid transparent; transition: 0.3s; }
  .feedback.neutral { background: #f2f8fd; color: #1c4f7c; border-color: rgba(127, 182, 224, 0.4); }
  .feedback.success { background: #e6f8ee; color: #155a3a; border-color: rgba(47, 168, 106, 0.4); }
  .feedback.error { background: #ffecec; color: #8a2020; border-color: rgba(217, 87, 87, 0.4); }
  .feedback.bonus { background: #fff8e2; color: #6b4b00; border-color: rgba(232, 178, 58, 0.6); font-weight: 600; }

  .footer-area { margin-top: 26px; padding-top: 22px; border-top: 2px dashed rgba(127, 182, 224, 0.35); display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center; }
  .stats { display: flex; gap: 12px; flex: 1 1 300px; }
  .stat-item { flex: 1; display: flex; justify-content: center; gap: 8px; background: #f0f7fd; border: 1px solid rgba(127, 182, 224, 0.35); padding: 10px; border-radius: 40px; font-size: 0.9rem; color: #1c4f7c; }
  .stat-item .math { font-weight: 700; font-size: 1.25rem; color: #2f7fb8; }
  
  .btn-reset { background: #ffffff; border: 2px solid #f0d0d0; color: #d95757; box-shadow: 0 4px 0 #f0d0d0; padding: 10px 20px; font-size: 0.95rem; }
  .btn-reset:hover { background: #fff5f5; border-color: #e8b4b4; color: #c53b3b; transform: translateY(-2px); box-shadow: 0 6px 0 #f0d0d0; }
  .btn-reset:active { transform: translateY(3px); box-shadow: 0 1px 0 #f0d0d0; }

  .toast { position: fixed; top: 28px; left: 50%; transform: translate(-50%, -160%); background: #f5c542; color: #5a4200; border: 2px solid #d9b44a; padding: 16px 34px; border-radius: 60px; font-size: 1.2rem; font-weight: 700; transition: 0.45s; z-index: 999; }
  .toast.show { transform: translate(-50%, 0); }

  @media (max-width: 640px) {
    .notebook { padding: 20px 16px; }
    .score-panel { grid-template-columns: 1fr; text-align: center; gap: 12px; }
    .score-total { justify-content: center; }
    .rules-hint { text-align: center; }
    .input-area { flex-direction: column; }
    .answer-box { width: 100%; flex: 1 1 auto; }
    .formula-display { font-size: 2rem; padding: 20px 10px; }
    .footer-area { flex-direction: column; }
    .stats { width: 100%; }
  }
</style>
</head>
<body>

<div class="bg-symbols" aria-hidden="true">
  <span>+</span><span>×</span><span>÷</span><span>=</span>
</div>

<main class="notebook">
  <header>
    <div class="header-left">
      <div class="logo-badge">📐</div>
      <div class="header-text">
        <h1>Tima Zadachka</h1>
        <p>математика · <b>3 класс</b> · тренажёр на баллы</p>
      </div>
    </div>
    <button class="sound-toggle" id="soundBtn" title="Включить/выключить звук">🔊</button>
  </header>

  <section class="score-panel">
    <div class="score-total">
      <span class="star">⭐</span><span>Баллы</span><span class="points" id="pointsTotal">0</span>
    </div>
    <div class="progress-info">
      <span>Правильных подряд: <b id="streakCount">0</b> / 10</span>
      <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
    </div>
    <div class="rules-hint">10 → 5⭐ · 8 → 4⭐ · 7 → 3⭐</div>
  </section>

  <section class="task-card">
    <div class="task-label">
      <span>Реши пример</span>
      <span class="task-number" id="taskCounter">пример №1</span>
    </div>

    <div class="formula-display" id="formulaDisplay">\( 7 + 5 = ? \)</div>

    <div class="input-area">
      <div class="answer-box">
        <span class="prefix">\( = \)</span>
        <input type="text" id="answerInput" placeholder="введи ответ" autocomplete="off" inputmode="numeric">
      </div>
      <div class="button-group">
        <button class="btn btn-primary" id="checkBtn">✓ Проверить</button>
        <button class="btn btn-secondary" id="newTaskBtn">↻ Новый</button>
      </div>
    </div>

    <div class="feedback neutral" id="feedback">
      <span class="math-icon">🧮</span>
      <span id="feedbackText">Реши пример и нажми «Проверить»</span>
    </div>

    <button class="btn btn-next" id="nextTaskBtn">⏭ Следующий пример</button>
  </section>

  <section class="footer-area">
    <div class="stats">
      <div class="stat-item"><span>✔ решено</span><span class="math" id="solvedCount">0</span></div>
      <div class="stat-item"><span>✖ ошибок</span><span class="math" id="errorCount">0</span></div>
      <div class="stat-item"><span>📋 всего</span><span class="math" id="totalCount">0</span></div>
    </div>
    <button class="btn btn-reset" id="resetBtn">🔄 Начать заново</button>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
  // --- СИСТЕМА ЗВУКОВ (Web Audio API) ---
  let audioCtx = null;
  let soundEnabled = true;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  // Универсальная функция для проигрывания тона
  function playTone(freq, type, duration, volume = 0.1, delay = 0) {
    if (!soundEnabled) return;
    initAudio();
    if (!audioCtx) return;
    
    setTimeout(() => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      
      gain.gain.setValueAtTime(volume, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }, delay * 1000);
  }

  const sounds = {
    click: () => playTone(600, 'sine', 0.1, 0.05),
    success: () => {
      playTone(440, 'sine', 0.1, 0.08, 0);
      playTone(554, 'sine', 0.1, 0.08, 0.1);
      playTone(659, 'sine', 0.2, 0.08, 0.2);
    },
    error: () => {
      playTone(220, 'triangle', 0.2, 0.08, 0);
      playTone(196, 'triangle', 0.3, 0.08, 0.1);
    },
    bonus: () => {
      playTone(523, 'sine', 0.1, 0.1, 0);
      playTone(659, 'sine', 0.1, 0.1, 0.1);
      playTone(784, 'sine', 0.1, 0.1, 0.2);
      playTone(1047, 'sine', 0.4, 0.1, 0.3);
    }
  };

  // --- ИГРОВАЯ ЛОГИКА ---
  const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
  
  function getRandomTask() {
    switch (randInt(1, 4)) {
      case 1: 
        let a1 = randInt(2, 90), b1 = randInt(2, 100 - a1);
        return { latex: `${a1} + ${b1} = ?`, answer: a1 + b1 };
      case 2:
        let a2 = randInt(10, 100), b2 = randInt(1, a2);
        return { latex: `${a2} - ${b2} = ?`, answer: a2 - b2 };
      case 3:
        let a3 = randInt(2, 10), b3 = randInt(2, 10);
        return { latex: `${a3} \\times ${b3} = ?`, answer: a3 * b3 };
      default:
        let b4 = randInt(2, 10), res4 = randInt(2, 10);
        return { latex: `${b4 * res4} \\div ${b4} = ?`, answer: res4 };
    }
  }

  let currentTask = null, taskIndex = 0, solved = 0, errors = 0, total = 0;
  let answeredCorrectly = false, points = 0, correctStreak = 0;
  let toastTimer = null;

  const el = id => document.getElementById(id);
  const formulaDisplay = el('formulaDisplay'), answerInput = el('answerInput');
  const checkBtn = el('checkBtn'), newTaskBtn = el('newTaskBtn'), nextTaskBtn = el('nextTaskBtn');
  const feedbackDiv = el('feedback'), feedbackText = el('feedbackText');
  const taskCounter = el('taskCounter'), pointsTotal = el('pointsTotal');
  const streakCount = el('streakCount'), progressBar = el('progressBar'), toastEl = el('toast');
  const resetBtn = el('resetBtn'), soundBtn = el('soundBtn');

  function showToast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3000);
  }

  function updateUI() {
    el('solvedCount').textContent = solved;
    el('errorCount').textContent = errors;
    el('totalCount').textContent = total;
    pointsTotal.textContent = points;
    streakCount.textContent = correctStreak;
    progressBar.style.width = (correctStreak / 10 * 100) + '%';
  }

  function setFeedback(type, text, icon = '🧮') {
    feedbackDiv.className = 'feedback ' + type;
    feedbackDiv.querySelector('.math-icon').textContent = icon;
    feedbackText.textContent = text;
  }

  function loadTask() {
    currentTask = getRandomTask();
    answeredCorrectly = false;
    taskIndex++;
    taskCounter.textContent = `пример №${taskIndex}`;
    formulaDisplay.innerHTML = '\\(' + currentTask.latex + '\\)';
    if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([formulaDisplay]);
    answerInput.value = '';
    answerInput.focus();
    setFeedback('neutral', 'Реши пример и нажми «Проверить»');
  }

  function handleCheck() {
    if (!currentTask) return;
    sounds.click();

    if (answeredCorrectly) {
      setFeedback('neutral', '✅ Этот пример уже решён! Жми «Новый».', '👍');
      return;
    }
    const val = answerInput.value.trim();
    if (!val) {
      setFeedback('neutral', '✏️ Введи ответ, пожалуйста.', '✏️');
      return;
    }
    const userNum = parseFloat(val.replace(',', '.'));
    if (isNaN(userNum)) {
      setFeedback('neutral', '❓ Пожалуйста, введи число.', '❓');
      return;
    }

    total++;
    const correct = currentTask.answer;
    const isCorrect = Math.abs(userNum - correct) < 1e-6;

    if (isCorrect) {
      solved++;
      answeredCorrectly = true;
      correctStreak++;
      
      if (correctStreak >= 10) {
        points += 5; correctStreak = 0;
        sounds.bonus();
        showToast('⭐ +5 баллов за 10 подряд!');
        setFeedback('bonus', '🎉 +5 баллов! Десять правильных подряд!', '🏆');
      } else if (correctStreak === 8) {
        points += 4; correctStreak = 0;
        sounds.bonus();
        showToast('⭐ +4 балла за 8 подряд!');
        setFeedback('bonus', '🎉 +4 балла! Восемь правильных подряд!', '🏆');
      } else if (correctStreak === 7) {
        points += 3; correctStreak = 0;
        sounds.bonus();
        showToast('⭐ +3 балла за 7 подряд!');
        setFeedback('bonus', '🎉 +3 балла! Семь правильных подряд!', '🏆');
      } else {
        sounds.success();
        setFeedback('success', `✅ Верно! ${correct} — правильный ответ.`, '🌟');
      }
    } else {
      errors++;
      correctStreak = 0;
      sounds.error();
      setFeedback('error', `❌ Неверно. Правильный ответ: ${correct}`, '🤔');
    }
    updateUI();
  }

  function handleReset() {
    sounds.click();
    if (confirm('Начать заново? Все баллы и статистика сбросятся.')) {
      solved = 0; errors = 0; total = 0;
      points = 0; correctStreak = 0;
      taskIndex = 0;
      loadTask();
      updateUI();
      showToast('🔄 Прогресс сброшен. Удачи!');
    }
  }

  function toggleSound() {
    soundEnabled = !soundEnabled;
    soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
    if (soundEnabled) {
      initAudio();
      sounds.click();
    }
  }

  // Привязка событий
  checkBtn.addEventListener('click', handleCheck);
  newTaskBtn.addEventListener('click', () => { sounds.click(); loadTask(); });
  nextTaskBtn.addEventListener('click', () => { sounds.click(); loadTask(); });
  resetBtn.addEventListener('click', handleReset);
  soundBtn.addEventListener('click', toggleSound);
  
  answerInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); handleCheck(); }
  });

  // Старт
  loadTask();
  updateUI();
</script>
</body>
</html>
